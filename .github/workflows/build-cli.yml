name: build-cli

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build
        run: ./packages/opencode/script/build.ts

      - name: Upload Windows CLI
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64
          path: packages/opencode/dist/opencode-windows-x64/bin/opencode.exe
          if-no-files-found: error
